{%- if site.ga4 and site.ga4 != "" and jekyll.environment == "production" %}

  <h2 class="solo-lettori" id="consenso-titolo">Statistiche del sito</h2>
  <p>Se accetti, usiamo Google Analytics per contare le visite al sito, in forma aggregata. Niente pubblicità né profilazione. <a href="{{ '/privacy/' | relative_url }}">Privacy e cookie</a></p>

  </div>
</section>
{%- endif %}
