# Come arrivare (dal vecchio sito)
come_arrivare:
  - modo: In autobus
    testo: >-
      Linea 6 dal centro, direzione Barcola–Miramare. Si scende alla fermata del
      circolo canottieri Saturnia, si attraversa e si prende la stradina sulla
      sinistra che scende al mare, fino in fondo.
  - modo: A piedi o in bici
    testo: >-
      Circa 4 km lungo la ciclabile per Barcola. Al parcheggio Bovedo (c'è il
      bike sharing) si segue la strada dei circoli nautici fino in fondo.
  - modo: In auto o camper
    testo: >-
      All'altezza dell'unico semaforo di Barcola. Parcheggio comodo e area camper
      al vicino Park Bovedo.

