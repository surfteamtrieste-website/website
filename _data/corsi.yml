# Corsi della scuola. Testi dal vecchio sito.
# I prezzi non si pubblicano: per prenotare si scrive all'istruttore (Contatti del club → referenti).

stagione: Tutto l'anno
dove: Barcola, nello specchio d'acqua davanti al Terrapieno
gruppi: Gruppi da 3–4 allievi, oppure lezioni singole
attrezzatura: L'attrezzatura per i corsi è fornita dal club
sconti:
  - "10% alle società convenzionate"
  - "15% a figli e coniugi dei soci"

elenco:
  - id: windsurf
    nome: Windsurf
    vela: windsurf
    sottotitolo: Dai primi passi sulla tavola alle prime planate
    testo: >-
      Il percorso accompagna l'allievo dai primi passi sulla tavola alle prime
      planate, fino a renderlo indipendente. A seconda delle esigenze si va
      dalle lezioni di gruppo alle lezioni singole.

  - id: wing-foil
    nome: Wing foil
    vela: wing
    sottotitolo: Lo sport del momento
    testo: >-
      Si pratica con un'ala gonfiabile e una tavola con il foil, una speciale
      pinna che solleva la tavola sopra l'acqua. Si impara facilmente ed è
      adatto anche a chi non è mai salito su un windsurf o un kitesurf.

  - id: sup
    nome: SUP
    vela: sup
    sottotitolo: Stand up paddle, remare in piedi
    testo: >-
      Uno sport molto intuitivo e di facile apprendimento, che si pratica a
      tutti i livelli: dall'uscita amatoriale fino all'agonismo.
