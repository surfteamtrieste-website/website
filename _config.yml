# ─────────────────────────────────────────────────────────────
#  Surf Team Trieste A.S.D. — configurazione del sito
#  Dopo ogni modifica a questo file GitHub ricostruisce il sito
#  da solo in 1-2 minuti.
# ─────────────────────────────────────────────────────────────

title: Surf Team Trieste
description: >-
  Windsurf club del Terrapieno di Barcola, Trieste, dal 1997.
  Windsurf, wing foil e SUP: corsi tutto l'anno, eventi, meteo dello spot.
lang: it

# Indirizzo del sito: online su www.surfteamtrieste.com dall'11 novembre 2026
# (file CNAME + DNS su Weebly). L'anteprima su github.io ora rimanda qui da sola.
url: "https://www.surfteamtrieste.com"
baseurl: ""

# true = Google non indicizza il sito (serviva per l'anteprima). Online: false.
anteprima: false

# Google Analytics 4 (account «Surf Team Trieste» di surfteamtrieste@gmail.com): parte solo se il visitatore accetta
# dal riquadro in fondo alla pagina. Lasciare vuoto ("") per spegnerlo.
ga4: "G-7J2DDS9E7H"

# Avviso sul vecchio dominio windsurfclubtrieste.it (non più del club): riquadro in fondo a ogni
# pagina e finestra che compare alla prima visita (e di nuovo dopo 30 giorni). Mettere false quando il problema è risolto.
avviso_dominio: true

# Vento Trieste: pagina meteo in tempo reale incorporata in /meteo/
ventotrieste: "https://ventotrieste.info/"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

collections:
  eventi:
    output: true
    permalink: /eventi/:name/

# Pubblica anche gli eventi con data futura (compaiono in cima all'albo).
future: true

defaults:
  - scope: { path: "", type: eventi }
    values: { layout: evento }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - NOTE-INTERNE.md
