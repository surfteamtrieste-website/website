# ─────────────────────────────────────────────────────────────
#  Surf Team Trieste A.S.D. — configurazione del sito
#  Dopo ogni modifica a questo file GitHub ricostruisce il sito
#  da solo in 1-2 minuti.
# ─────────────────────────────────────────────────────────────

title: Surf Team Trieste
description: >-
  Windsurf club del Terrapieno di Barcola, Trieste, dal 1997.
  Windsurf, wing foil e SUP: corsi tutto l'anno, eventi, meteo dello spot.
lang: it

# Indirizzo del sito.
# ANTEPRIMA (oggi):  url "https://surfteamtrieste-website.github.io"  +  baseurl "/website"
# DOMINIO VERO (dopo il passaggio): url "https://www.surfteamtrieste.com"  +  baseurl ""
url: "https://surfteamtrieste-website.github.io"
baseurl: "/website"

# Finché è true Google non indicizza il sito (serve per l'anteprima).
# Mettere false solo quando il sito va su surfteamtrieste.com.
anteprima: true

# Modulo "Lezioni": le richieste arrivano a surfteamtrieste@gmail.com tramite FormSubmit
# (formsubmit.co, gratuito, senza account). Se il servizio non risponde, il modulo
# propone la stessa mail già scritta da mandare con la propria posta.
# Lasciando "" il modulo apre direttamente l'app di posta di chi scrive (vedi README).
form_endpoint: "https://formsubmit.co/ajax/surfteamtrieste@gmail.com"

# Avviso sul vecchio dominio windsurfclubtrieste.it (non più del club): finestra che compare
# alla prima visita (e di nuovo dopo 30 giorni). Mettere false quando il problema è risolto.
avviso_dominio: true

# Vento Trieste: pagina meteo in tempo reale incorporata in /meteo/
ventotrieste: "https://ventotrieste.info/"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

collections:
  eventi:
    output: true
    permalink: /eventi/:name/

# Pubblica anche gli eventi con data futura (vanno in «Prossimi appuntamenti»).
future: true

defaults:
  - scope: { path: "", type: eventi }
    values: { layout: evento }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - NOTE-INTERNE.md
